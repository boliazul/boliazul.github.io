<style>
:root{
  --fondo:#0F241B;
  --carta:#163326;
  --verde:#1F4D3A;
  --borde:#285C46;
  --crema:#FBF8F2;
  --apagado:#8FAE9E;
  --sol:#F2C879;
  --display:"Bricolage Grotesque",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --ui:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--fondo);color:var(--crema);
  font-family:var(--ui);font-size:16px;line-height:1.5;
  overflow:hidden;
}
#app{
  height:100dvh;display:flex;flex-direction:column;
  max-width:560px;margin:0 auto;padding:0 20px;
}

/* ---- barra superior ---- */
.top{padding:16px 0 0;flex:none}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:11px}
.mark{font-family:"Source Serif 4",Georgia,serif;font-weight:600;font-size:15px;color:var(--apagado)}
.count{font-family:var(--ui);font-size:13px;font-weight:600;color:var(--apagado);font-variant-numeric:tabular-nums}
.track{height:5px;background:rgba(251,248,242,.12);border-radius:99px;overflow:hidden}
.fill{height:100%;width:0;background:var(--sol);border-radius:99px;transition:width .32s cubic-bezier(.4,0,.2,1)}

/* ---- carta ---- */
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;overflow-y:auto;padding:22px 0}
.card{animation:in .34s cubic-bezier(.16,1,.3,1) both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.kicker{font-family:var(--ui);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--sol);margin:0 0 12px}
h1{
  font-family:var(--display);font-weight:800;
  font-size:clamp(27px,7.2vw,38px);line-height:1.1;letter-spacing:-.025em;
  margin:0;text-wrap:balance;
}
.hint{font-size:15px;color:var(--apagado);margin:12px 0 0;max-width:40ch;line-height:1.45}

/* ---- opciones ---- */
.opts{display:flex;flex-direction:column;gap:9px;margin-top:26px}
.opts.wrap{flex-direction:row;flex-wrap:wrap}
.opt{
  font-family:var(--ui);font-size:16.5px;font-weight:500;text-align:left;
  background:var(--carta);color:var(--crema);
  border:1.5px solid var(--borde);border-radius:15px;
  padding:15px 18px;cursor:pointer;
  transition:transform .1s ease,background .13s ease,border-color .13s ease,color .13s ease;
}
.opts.wrap .opt{flex:0 1 auto;padding:12px 17px;border-radius:99px;font-size:15.5px}
.opt:active{transform:scale(.975)}
.opt[aria-pressed="true"]{background:var(--crema);border-color:var(--crema);color:var(--fondo);font-weight:600}
.opt:focus-visible,.nav button:focus-visible,.field:focus-visible,.dot:focus-visible{outline:2px solid var(--sol);outline-offset:3px}

/* ---- escala ---- */
.dots{display:flex;gap:8px;margin-top:26px}
.dot{
  flex:1;aspect-ratio:1/1;max-height:66px;
  background:var(--carta);border:1.5px solid var(--borde);border-radius:15px;
  color:var(--crema);font-family:var(--display);font-weight:700;font-size:21px;
  cursor:pointer;transition:transform .1s ease,background .13s ease,color .13s ease,border-color .13s ease;
}
.dot:active{transform:scale(.94)}
.dot[aria-pressed="true"]{background:var(--sol);border-color:var(--sol);color:var(--fondo)}
.dots.ten{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:24px}
.dots.ten .dot{aspect-ratio:auto;height:54px;font-size:18px;border-radius:13px}
.ends{display:flex;justify-content:space-between;font-size:12.5px;color:var(--apagado);margin-top:9px}

/* ---- filas de notas ---- */
.rows{margin-top:22px;display:flex;flex-direction:column;gap:2px}
.rw{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(251,248,242,.09)}
.rw:last-child{border-bottom:none}
.rw-name{flex:1;font-size:16px;font-weight:500;min-width:0}
.rw-name small{display:block;font-size:12px;color:var(--apagado);font-weight:400}
.rw-dots{display:flex;gap:5px}
.mini{
  width:37px;height:37px;background:var(--carta);border:1.5px solid var(--borde);
  border-radius:11px;color:var(--apagado);font-family:var(--display);font-weight:700;font-size:15px;
  cursor:pointer;transition:background .13s ease,color .13s ease,border-color .13s ease;
  font-variant-numeric:tabular-nums;
}
.mini[aria-pressed="true"]{background:var(--sol);border-color:var(--sol);color:var(--fondo)}
@media(max-width:400px){.mini{width:32px;height:34px}}

/* ---- texto ---- */
.field{
  width:100%;margin-top:26px;
  font-family:var(--display);font-weight:500;font-size:20px;color:var(--crema);
  background:transparent;border:none;border-bottom:2px solid var(--borde);
  padding:10px 2px;transition:border-color .15s ease;
}
.field::placeholder{color:rgba(143,174,158,.65);font-weight:500}
.field:focus{border-bottom-color:var(--sol);outline:none}
textarea.field{border:1.5px solid var(--borde);border-radius:15px;padding:14px 16px;font-size:18px;line-height:1.45;resize:none}
textarea.field:focus{border-color:var(--sol)}

/* ---- navegación ---- */
.nav{flex:none;display:flex;gap:11px;padding:14px 0 calc(18px + env(safe-area-inset-bottom))}
.nav button{
  font-family:var(--ui);font-size:16px;font-weight:600;
  border-radius:99px;padding:15px 24px;cursor:pointer;border:1.5px solid var(--borde);
  background:transparent;color:var(--apagado);transition:opacity .15s ease,background .15s ease}
.nav .next{flex:1;background:var(--crema);border-color:var(--crema);color:var(--fondo)}
.nav .next.quiet{background:transparent;border-color:var(--borde);color:var(--apagado);font-weight:500}
.nav .next.go{background:var(--sol);border-color:var(--sol)}
.nav button[disabled]{opacity:.32;cursor:default}
.back{min-width:60px;text-align:center}

/* ---- pantallas de inicio y fin ---- */
.big{font-family:var(--display);font-weight:800;font-size:clamp(34px,10vw,52px);line-height:1.02;letter-spacing:-.03em;margin:0;text-wrap:balance}
.lead{font-size:17px;color:var(--crema);margin:20px 0 0;max-width:34ch;line-height:1.5}
.lead b{color:var(--sol);font-weight:600}
.small{font-size:14px;color:var(--apagado);margin:18px 0 0;max-width:38ch;line-height:1.5}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:14.5px;color:var(--apagado);line-height:1.45}
.chk span{color:var(--sol);font-weight:700}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="top-row"><span class="mark">sergio vega.</span><span class="count" id="count"></span></div>
    <div class="track"><div class="fill" id="fill"></div></div>
  </div>
  <div class="stage" id="stage"></div>
  <div class="nav" id="nav"></div>
</div>

<script>
(function(){
var TEL="34694918102";

var Q=[
 {t:"intro"},
 {k:"Nombre",type:"text",q:"Para empezar, ¿cómo te llamas?",ph:"Tu nombre"},
 {k:"Curso",type:"single",q:"¿Qué curso empiezas?",wrap:1,o:["1º ESO","2º ESO","3º ESO","4º ESO","1º Bach","2º Bach"]},
 {k:"Me gusta más",type:"single",q:"¿Qué asignatura te gusta más?",wrap:1,o:["Mates","Lengua","Inglés","Física y Química","Biología","Historia","Valencià","Tecnología","EF","Ninguna"]},
 {k:"Llevo peor",type:"single",q:"¿Y cuál llevas peor?",wrap:1,o:["Mates","Lengua","Inglés","Física y Química","Biología","Historia","Valencià","Tecnología","Varias"]},
 {k:"Por qué va peor",type:"multi",q:"¿Por qué esa va peor?",h:"Marca las que quieras. Nadie se enfada.",o:["No la entiendo","Me aburre","Es mucho de memoria","Me perdí hace tiempo","El profe","Me bloqueo en los exámenes"]},
 {k:"Ponte nota",type:"rows",q:"Ponte nota tú mismo",h:"Del 1 (fatal) al 5 (me lo sé). Cómo te ves TÚ, no lo que pone el boletín.",
  r:[["Mates"],["Lengua"],["Inglés"],["Física y Química"],["Valencià"],["Cálculo","de cabeza"],["Lectura","leer y enterarme"]]},
 {k:"Cuando me atasco",type:"multi",q:"Estás con un ejercicio y no sabes seguir. ¿Qué haces?",h:"Lo que haces DE VERDAD, no lo que se supone que hay que hacer.",
  o:["Lo dejo y paso al siguiente","Pregunto en casa","Se lo pregunto a un amigo","Lo busco en internet","Se lo pido a una IA","Sigo intentándolo","Lo dejo para mañana"]},
 {k:"Uso de IA",type:"single",q:"¿Usas ChatGPT u otra IA para los deberes?",h:"Da igual lo que contestes, esto no se lo cuento a nadie.",
  o:["Nunca","A veces, para entender algo","Para que me lo haga","Lo probé y no me sirvió"]},
 {k:"Cómo estudio",type:"multi",q:"Cuando estudias, ¿qué haces de verdad?",o:["Releer","Subrayar","Resúmenes o esquemas","Hacer ejercicios","Vídeos de YouTube","Todo a última hora"]},
 {k:"Días antes del examen",type:"single",q:"¿Cuántos días antes de un examen empiezas a estudiar?",o:["El mismo día","El día antes","2 o 3 días antes","Una semana antes","Lo llevo al día"]},
 {k:"Dónde estudio",type:"single",q:"¿Dónde estudias?",wrap:1,o:["Mi cuarto","El salón","La cocina","Donde pillo"]},
 {k:"Hábito",type:"single",q:"¿Siempre haces lo mismo al ponerte?",o:["Sí, siempre igual","A veces","Cada día distinto"]},
 {k:"Apuntes",type:"single",q:"¿Tienes los apuntes completos?",h:"Sin trampa: si falta media libreta, mejor saberlo ahora.",wrap:1,o:["Sí, todo","Casi todo","A trozos","Poca cosa"]},
 {k:"Agenda",type:"single",q:"¿Llevas agenda?",wrap:1,o:["En papel","En el móvil","Las dos","De cabeza"]},
 {k:"Quién me ayuda",type:"multi",q:"¿Te ayuda alguien a estudiar?",o:["Nadie","Mi madre o mi padre","Hermanos","Amigos","Profe particular"]},
 {k:"Trabajos en equipo",type:"single",q:"En los trabajos en grupo, ¿sabes cómo empezar?",o:["Sí, organizo yo","Me cuesta arrancar","Me dejo llevar"]},
 {k:"Cómo prefiero que me expliquen",type:"multi",q:"¿Cómo prefieres que te expliquen algo difícil?",o:["Con ejemplos reales","Con vídeos","Practicando juntos","Paso a paso en papel","Con retos y juegos"]},
 {k:"Quiero mejorar",type:"single",q:"¿Quieres mejorar tus notas?",o:["Sí","Sí, pero no sé cómo","Me da un poco igual","No"]},
 {k:"Pregunto en clase",type:"single",q:"Cuando no entiendes algo en clase, ¿preguntas?",o:["Sí, en el momento","Al profe, pero al acabar","Se lo pregunto a un compañero","Lo dejo pasar","Me da corte delante de todos"]},
 {k:"Retener",type:"single",q:"¿Te cuesta retener lo que explican en clase?",o:["Casi nunca","A veces","Muchas veces"]},
 {k:"Enunciados",type:"single",q:"Lees el enunciado de un ejercicio. ¿Sabes por dónde empezar?",o:["Casi siempre","A veces me pierdo","Casi nunca"]},
 {k:"En un examen",type:"single",q:"En un examen, ¿qué te pasa?",o:["Voy tranquilo","Nervios normales","Me bloqueo aunque me lo sepa"]},
 {k:"Hora de dormir",type:"single",q:"¿A qué hora te duermes entre semana?",h:"Sinceridad. Esto no llega al cole.",o:["Antes de las 22:30","Sobre las 23:00","Sobre las 24:00","Con el móvil hasta caer"]},
 {k:"Dispuesto",type:"single",q:"Si mejorar no te costara mucho esfuerzo, ¿estarías dispuesto?",o:["Sí, claro","Depende","Ni así"]},
 {k:"Qué piensan de mí",type:"area",q:"¿Qué crees que piensan los demás de ti?",ph:"Lo primero que se te ocurra"},
 {k:"Los de buenas notas",type:"single",q:"Los que sacan mejores notas… ¿son marcianos?",h:"O sea, ¿son verdes y tienen antenas?",o:["Sí, verdes y con antenas","No, son como yo","Nunca lo había pensado"]},
 {k:"Me inspira",type:"text",q:"¿Tienes algo o alguien que te inspire?",ph:"Una persona, un equipo, lo que sea"},
 {k:"Me gusta",type:"multi",q:"Fuera de clase, ¿qué te gusta?",wrap:1,o:["Deporte","Videojuegos","Música","Dibujar","Series","Amigos","Leer"]},
 {k:"Mis tardes",type:"multi",q:"¿Qué ocupa tus tardes entre semana?",h:"Marca todo lo que tengas fijo.",wrap:1,o:["Deporte","Academia o clases","Idiomas","Música o baile","Cuidar de alguien en casa","Nada fijo"]},
 {k:"A qué juego / qué sigo",type:"text",q:"¿A qué juegas, qué ves, qué equipo sigues?",h:"Para explicarte las cosas con tus ejemplos, no con los míos.",ph:"Sé concreto"},
 {k:"Cuando nadie me mira",type:"area",q:"¿Qué te gusta hacer cuando nadie te mira?",h:"Lo que haces por gusto, sin que nadie te lo mande. Aparte de pantallas.",ph:"Lo que sea"},
 {k:"En junio estaría haciendo distinto",type:"area",q:"Imagina que llega junio y ha ido bien. ¿Qué estarías haciendo distinto de lo que haces ahora?",h:"No hace falta que hables de notas. Piensa en un día normal tuyo.",ph:"Lo que se te ocurra"},
 {k:"Confianza en que puedo mejorar",type:"scale10",q:"Del 1 al 10, ¿cuánta confianza tienes en que puedes mejorar si alguien te echa una mano?",h:"No es cuántas ganas tienes. Es cuánto crees que puedes.",lo:"Nada",hi:"Del todo"},
 {k:"Por qué no un número más bajo",type:"area",q:"__CONF__",ph:"Lo primero que pienses"},
 {t:"fin"}
];

var A={}, i=0, TOTAL=Q.length-2;
var stage=document.getElementById("stage"), nav=document.getElementById("nav"),
    fill=document.getElementById("fill"), count=document.getElementById("count");

function answered(){
  var n=0;
  Q.forEach(function(q){
    if(!q.k)return;var v=A[q.k];
    if(v===undefined||v===null||v==="")return;
    if(q.type==="rows"){if(Object.keys(v).length)n++;return;}
    if(Array.isArray(v)){if(v.length)n++;return;}
    if(String(v).length)n++;
  });
  return n;
}

function set(k,v){A[k]=v;paint();}

function has(q){var v=A[q.k];return v!==undefined&&String(v).length>0;}

function next(){if(i<Q.length-1){i++;render();}}
function prev(){if(i>0){i--;render();}}

function paint(){
  var n=answered();
  fill.style.width=Math.round(n/TOTAL*100)+"%";
  count.textContent=n+(n===1?" contestada":" contestadas");
}

function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}

function render(){
  var q=Q[i];
  stage.innerHTML="";nav.innerHTML="";
  var c=el("div","card");

  if(q.t==="intro"){
    c.appendChild(el("p","kicker","Punto de partida · 2026-27"));
    var h=el("h1","big","No es un examen.");h.className="big";c.appendChild(h);
    var l=el("p","lead");l.innerHTML="No puntúa, no hay respuestas buenas ni malas y no lo ve nadie más. Solo sirve para que sepa por dónde empezar contigo. <b>Cuanto más sincero seas, más cortas serán las sesiones.</b>";
    c.appendChild(l);
    var c1=el("div","chk");c1.innerHTML="<span>·</span><div>Una pregunta por pantalla. Unos 6 minutos.</div>";c.appendChild(c1);
    var c2=el("div","chk");c2.innerHTML="<span>·</span><div>Puedes saltarte lo que no quieras contestar.</div>";c.appendChild(c2);
    var c3=el("div","chk");c3.innerHTML="<span>·</span><div>Al final se manda solo por WhatsApp.</div>";c.appendChild(c3);
    stage.appendChild(c);
    var b=el("button","next go","Empezar");b.onclick=next;nav.appendChild(b);
    paint();return;
  }

  if(q.t==="fin"){
    var n=answered();
    c.appendChild(el("p","kicker","Ya está"));
    var hf=el("h1","big","Hecho.");hf.className="big";c.appendChild(hf);
    var lf=el("p","lead");lf.innerHTML="Has contestado <b>"+n+" de "+TOTAL+"</b>. Dale al botón y se abre WhatsApp con todo escrito: solo tienes que enviarlo.";
    c.appendChild(lf);
    c.appendChild(el("p","small","Esto lo leo solo yo. Guardo un resumen para preparar tus sesiones y nada más: no va al cole, no va a ninguna app y no puntúa. Si un día quieres que lo borre, me lo dices."));
    stage.appendChild(c);
    var back=el("button","back","Atrás");back.onclick=prev;nav.appendChild(back);
    var cop=el("button","back","Copiar");
    cop.onclick=function(){navigator.clipboard.writeText(build()).then(function(){cop.textContent="Copiado";});};
    nav.appendChild(cop);
    var send=el("button","next go","Enviar por WhatsApp");
    send.onclick=function(){window.open("https://wa.me/"+TEL+"?text="+encodeURIComponent(build()),"_blank");};
    nav.appendChild(send);
    paint();return;
  }

  c.appendChild(el("p","kicker","Pregunta "+i+" de "+TOTAL));
  var texto=q.q;
  if(texto==="__CONF__"){
    var cf=parseInt(A["Confianza en que puedo mejorar"]||"0",10);
    texto = cf<=1 ? "¿Qué haría falta para que en vez de un 1 fuera un 2?"
                  : "¿Y por qué un "+(cf||"…")+" y no un número más bajo?";
  }
  c.appendChild(el("h1",null,texto));
  if(q.h)c.appendChild(el("p","hint",q.h));

  if(q.type==="single"||q.type==="multi"){
    var box=el("div","opts"+(q.wrap?" wrap":""));
    q.o.forEach(function(o){
      var b=el("button","opt",o);b.type="button";
      var on = q.type==="multi" ? (A[q.k]||[]).indexOf(o)>-1 : A[q.k]===o;
      b.setAttribute("aria-pressed",on?"true":"false");
      b.onclick=function(){
        if(q.type==="multi"){
          var cur=A[q.k]||[],p=cur.indexOf(o);
          if(p>-1)cur.splice(p,1);else cur.push(o);
          set(q.k,cur.length?cur:"");
          b.setAttribute("aria-pressed",p>-1?"false":"true");
        }else{
          box.querySelectorAll(".opt").forEach(function(x){x.setAttribute("aria-pressed","false");});
          b.setAttribute("aria-pressed","true");set(q.k,o);
          setTimeout(next,300);
        }
      };
      box.appendChild(b);
    });
    c.appendChild(box);
  }

  if(q.type==="scale10"){
    var d10=el("div","dots ten");
    for(var m=1;m<=10;m++){(function(v){
      var b=el("button","dot",v);b.type="button";
      b.setAttribute("aria-pressed",A[q.k]===String(v)?"true":"false");
      b.onclick=function(){
        d10.querySelectorAll(".dot").forEach(function(x){x.setAttribute("aria-pressed","false");});
        b.setAttribute("aria-pressed","true");set(q.k,String(v));setTimeout(next,320);
      };
      d10.appendChild(b);
    })(m);}
    c.appendChild(d10);
    var e10=el("div","ends");e10.appendChild(el("span",null,q.lo));e10.appendChild(el("span",null,q.hi));
    c.appendChild(e10);
  }

  if(q.type==="scale"){
    var d=el("div","dots");
    for(var n2=1;n2<=5;n2++){(function(v){
      var b=el("button","dot",v);b.type="button";
      b.setAttribute("aria-pressed",A[q.k]===v+"/5"?"true":"false");
      b.onclick=function(){
        d.querySelectorAll(".dot").forEach(function(x){x.setAttribute("aria-pressed","false");});
        b.setAttribute("aria-pressed","true");set(q.k,v+"/5");setTimeout(next,300);
      };
      d.appendChild(b);
    })(n2);}
    c.appendChild(d);
    var e=el("div","ends");e.appendChild(el("span",null,q.lo));e.appendChild(el("span",null,q.hi));
    c.appendChild(e);
  }

  if(q.type==="rows"){
    var wrapR=el("div","rows");
    A[q.k]=A[q.k]||{};
    q.r.forEach(function(r){
      var row=el("div","rw");
      var nm=el("div","rw-name",r[0]);
      if(r[1]){var s=el("small",null,r[1]);nm.appendChild(s);}
      row.appendChild(nm);
      var dd=el("div","rw-dots");
      for(var v=1;v<=5;v++){(function(val){
        var b=el("button","mini",val);b.type="button";
        b.setAttribute("aria-label",r[0]+": "+val);
        b.setAttribute("aria-pressed",A[q.k][r[0]]===val?"true":"false");
        b.onclick=function(){
          dd.querySelectorAll(".mini").forEach(function(x){x.setAttribute("aria-pressed","false");});
          b.setAttribute("aria-pressed","true");A[q.k][r[0]]=val;paint();
        };
        dd.appendChild(b);
      })(v);}
      row.appendChild(dd);wrapR.appendChild(row);
    });
    c.appendChild(wrapR);
  }

  if(q.type==="text"||q.type==="area"){
    var f=q.type==="area"?el("textarea","field"):el("input","field");
    if(q.type==="area")f.rows=3;else f.type="text";
    f.placeholder=q.ph||"";f.value=A[q.k]||"";
    f.oninput=function(){A[q.k]=f.value.trim();paint();};
    f.onkeydown=function(e2){if(q.type==="text"&&e2.key==="Enter"){e2.preventDefault();next();}};
    c.appendChild(f);
    setTimeout(function(){f.focus();},220);
  }

  stage.appendChild(c);
  var back2=el("button","back","Atrás");back2.onclick=prev;nav.appendChild(back2);
  var nx=el("button","next"+(has(q)?"":" quiet"),has(q)?"Siguiente":"Saltar");
  nx.onclick=next;nav.appendChild(nx);
  paint();
}

function build(){
  var nombre=A["Nombre"]||"(sin nombre)";
  var t="CUESTIONARIO ALUMNO — Punto de partida\n"+nombre+"\n\n";
  Q.forEach(function(q){
    if(!q.k)return;var v=A[q.k];
    if(v===undefined||v===""||v===null)return;
    if(q.k==="Nombre")return;
    if(q.type==="rows"){
      var parts=[];q.r.forEach(function(r){if(v[r[0]])parts.push(r[0]+" "+v[r[0]]);});
      if(parts.length)t+="· Se pone: "+parts.join(" · ")+"\n";
    }else if(Array.isArray(v)){ if(v.length) t+="· "+q.k+": "+v.join(", ")+"\n"; }
    else t+="· "+q.k+": "+v+(q.type==="scale10"?"/10":"")+"\n";
  });
  return t;
}

render();
})();
