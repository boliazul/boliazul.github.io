<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>El puzle de las provincias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Delius&family=Poppins:wght@400;600;700&display=swap">
<style>
/* Un solo tema, a propósito: el papel azul claro de los materiales del profesor */
:root{
  color-scheme:light;
  --bg:#E1F1FC; --surface:#FFFFFF; --edge:#1C1C1C; --line:#C9DDEB;
  --ink:#1C1C1C; --mut:#4F5866; --faint:#7C8796; --blue:#2F86C6;
  --ok:#157A5C; --okbg:#D9F2E6; --no:#B4462C; --nobg:#FBE3DA;
  --hole:#FFFFFF; --sobre:#FFE9A8;
  --disp:'Fredoka','Poppins',system-ui,sans-serif;
  --hand:'Delius','Comic Sans MS',cursive;
  --body:'Poppins',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
     -webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:18px 40px;display:flex;flex-direction:column;gap:14px}
.cab{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 20px}
.eyebrow{font-family:var(--hand);font-size:clamp(17px,3.6vw,22px);color:var(--blue);margin:0}
h1{font-family:var(--disp);font-weight:600;font-size:clamp(30px,7vw,46px);line-height:1;margin:2px 0 0;letter-spacing:.5px;color:#2E3440}
.subraya{display:block;margin-top:4px}
p{margin:0}
.niveles{display:flex;gap:7px}
.niv{font-family:var(--disp);font-size:17px;font-weight:600;width:42px;height:42px;border-radius:12px;
     border:2.5px solid var(--edge);background:var(--surface);color:var(--ink);cursor:pointer;position:relative}
.niv.on{background:#F8E595}
.niv.hecho::after{content:"✓";position:absolute;right:-7px;top:-9px;width:20px;height:20px;border-radius:50%;
     background:var(--ok);color:#fff;font-size:12px;line-height:20px;border:2px solid var(--surface)}
.niv:focus-visible,.btn:focus-visible,.pieza:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.info{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 16px}
.nivTit{font-family:var(--disp);font-weight:600;font-size:21px}
.nivSub{color:var(--mut);font-size:14.5px}
.contador{font-family:var(--disp);font-weight:600;font-size:15px;background:var(--surface);border:2.5px solid var(--edge);
          border-radius:99px;padding:3px 14px;white-space:nowrap}

.juego{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:880px){.juego{grid-template-columns:minmax(0,1fr) 310px;align-items:start}}
.mapaBox{background:var(--surface);border:3px solid var(--edge);border-radius:18px;padding:10px}
svg#mapa{display:block;width:100%;height:auto;touch-action:pan-x pan-y}
.mapaTop{display:flex;justify-content:flex-end;padding:0 0 6px}
.visor{overflow:auto;border-radius:12px;background:#F3F9FE;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.visor.zoom{max-height:62vh}
.visor.zoom svg#mapa{width:230%}
#mapa text.lab{font-family:var(--body);font-weight:600;font-size:12.5px;fill:var(--ink);
  paint-order:stroke;stroke:#FFFFFF;stroke-width:3.4px;stroke-linejoin:round;pointer-events:none}
#mapa text.lab.nueva{fill:var(--ok)}
#mapa path.prov{stroke-width:1.2;stroke-linejoin:round;transition:fill .3s ease}
#mapa path.puesta{fill:var(--c);stroke:#FFFFFF}
#mapa path.hueco{fill:var(--hole);stroke:var(--ink);stroke-width:1.6;stroke-dasharray:4 3}
#mapa path.hueco.sobre{fill:var(--sobre)}
#mapa path.recien{animation:brilla .9s ease}
@keyframes brilla{0%{filter:brightness(1.25) saturate(1.6)}100%{filter:none}}
#mapa path.pista{animation:pista 1s ease-in-out 3}
@keyframes pista{50%{fill:var(--sobre)}}
#mapa .ccaa{fill:none;stroke:#2E3440;stroke-width:2.3;stroke-linejoin:round;opacity:.75;pointer-events:none}
#mapa .borde{fill:none;stroke:#9AA7B6;stroke-width:1.2;stroke-dasharray:5 4}
#mapa circle.cap{fill:var(--ink);stroke:#fff;stroke-width:1.2}
#mapa circle.chispa{pointer-events:none;animation:chispa .75s ease-out forwards}
@keyframes chispa{from{opacity:1;transform:translate(0,0) scale(1)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.4)}}
.leyenda{min-height:46px;margin-top:8px;padding:10px 14px;border-radius:12px;font-size:15px;background:#F3F9FE;color:var(--mut);border:2px solid var(--line)}
.leyenda b{color:var(--ink);font-weight:700}
.leyenda.bien{background:var(--okbg);color:var(--ok);border-color:#A9DCC5} .leyenda.bien b{color:var(--ok)}
.leyenda.mal{background:var(--nobg);color:var(--no);border-color:#F1BBA8} .leyenda.mal b{color:var(--no)}

.mesa{background:var(--surface);border:3px solid var(--edge);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px}
.mesaCab{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mesaCab span{font-family:var(--hand);font-size:16px;color:var(--blue)}
.piezas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
@media (min-width:880px){.piezas{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pieza{touch-action:none;cursor:grab;border:2.5px solid var(--edge);border-radius:14px;background:var(--pc,#fff);
       padding:8px 6px 7px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:98px;justify-content:center;
       transition:transform .12s ease}
.pieza:hover{transform:translateY(-2px) rotate(-1deg)}
.pieza svg{width:50px;height:42px;display:block}
.pieza svg path{fill:#FFFFFF;stroke:var(--ink);stroke-width:2.2;vector-effect:non-scaling-stroke}
.pieza .et{font-family:var(--disp);font-size:15.5px;font-weight:600;line-height:1.1;text-align:center;color:var(--ink);overflow-wrap:anywhere}
.pieza .et small{display:block;font-family:var(--body);font-weight:400;color:var(--mut);font-size:11px;margin-top:2px}
.suave{font-weight:400;opacity:.75}
.pieza.cogida{opacity:.3}
.pieza.sacude{animation:sacude .35s ease}
@keyframes sacude{25%{transform:translateX(-7px) rotate(-3deg)}75%{transform:translateX(7px) rotate(3deg)}}
.btn{font-family:var(--disp);font-weight:600;font-size:15px;cursor:pointer;border-radius:12px;padding:9px 16px;
     border:2.5px solid var(--edge);background:var(--surface);color:var(--ink)}
.btn.main{background:#93C9F2}
.btn.mini{font-size:13.5px;padding:5px 11px}
.fantasma{position:fixed;left:0;top:0;pointer-events:none;z-index:50;filter:drop-shadow(0 8px 10px rgba(0,0,0,.3))}
.fantasma path{fill:var(--pc);stroke:var(--ink);stroke-width:1.4}
.fantasma .mira{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--ink);border:2px solid #fff}
.fin{background:var(--surface);border:3px solid var(--edge);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.fin h2{font-family:var(--disp);font-weight:600;font-size:26px;margin:0}
.fin ul{margin:0;padding-left:18px} .fin li{margin-bottom:3px}
.fin li span{font-size:12px;color:var(--faint);margin-left:6px}
.fila{display:flex;flex-wrap:wrap;gap:8px}
.nota{font-size:13px;color:var(--mut)}
.confeti{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:cae 1.6s ease-in forwards;pointer-events:none}
@keyframes cae{to{transform:translateY(260px) rotate(540deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head><body>


<div class="wrap">
  <div class="cab">
    <div>
      <p class="eyebrow">Geografía · 2.º ESO · provincias y capitales</p>
      <h1>El puzle de las provincias</h1>
      <svg class="subraya" width="260" height="22" viewBox="0 0 260 22" aria-hidden="true"><path d="M3 14 C 70 5, 160 4, 232 9 C 252 11, 255 18, 236 19 C 212 20, 196 16, 214 12" fill="none" stroke="#2F86C6" stroke-width="3.5" stroke-linecap="round"/></svg>

    <div class="niveles" id="niveles" role="tablist" aria-label="Niveles"></div>

  <div class="info">
    <div><span class="nivTit" id="nivTit"></span> <span class="nivSub" id="nivSub"></span></div>
    <span class="contador" id="contador"></span>
  </div>

  <div class="juego">
    <div class="mapaBox">
      <div class="mapaTop"><button class="btn mini" id="lupa">Ampliar el mapa</button></div>
      <div class="visor" id="visor"><svg id="mapa" viewBox="0 138 960 692" role="img" aria-label="Mapa de las provincias de España"></svg></div>
      <div class="leyenda" id="leyenda">Arrastra cada pieza a su hueco. Si no es su sitio, vuelve a la mesa.</div>
    </div>
    <div>
      <div class="mesa" id="mesa">
        <div class="mesaCab"><span id="caja"></span><button class="btn mini" id="cambiar">Otras piezas</button></div>
        <div class="piezas" id="piezas"></div>
      </div>
      <div class="fin" id="fin" hidden></div>
    </div>
  </div>
  <p class="nota">Sin reloj y sin puntos. Cada pieza solo encaja en su sitio.</p>
</div>

 CYL:['05','09','24','34','37','40','42','47','49'],CLM:['02','13','16','19','45'],CAT:['08','17','25','43'],VAL:['03','12','46'],
 EXT:['06','10'],GAL:['15','27','32','36'],MAD:['28'],MUR:['30'],NAV:['31'],PV:['01','20','48'],RIO:['26']};
const PAL={azul:'#93C9F2',verde:'#B9E1D2',amar:'#F8E595',salm:'#F4C9B6',lila:'#C9CDEB',rosa:'#EBC3D8'};
const COLOR_CA={GAL:'azul',AST:'amar',CANT:'rosa',PV:'verde',NAV:'lila',RIO:'salm',CYL:'lila',ARA:'amar',CAT:'rosa',MAD:'rosa',
 CLM:'verde',EXT:'amar',VAL:'azul',MUR:'salm',AND:'azul',BAL:'verde',CAN:'salm'};

function mezcla(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
const NIVELES=[
 {t:'Nivel 1',s:'Seis grandes, para coger el truco',ids:()=>GRANDES,solo:false},
 {t:'Nivel 2',s:'Las ocho que no se llaman igual',ids:()=>HARD,solo:false},

const svg=$('mapa'); const paths={}; const dots={};
const gP=document.createElementNS(NS,'g'), gD=document.createElementNS(NS,'g');
G.p.forEach(p=>{
  const e=document.createElementNS(NS,'path'); e.setAttribute('d',p.d); e.setAttribute('class','prov puesta');
  e.dataset.id=p.id; e.style.setProperty('--c',COL[p.id]); gP.appendChild(e); paths[p.id]=e;
  const c=document.createElementNS(NS,'circle'); c.setAttribute('cx',p.cp[0]); c.setAttribute('cy',p.cp[1]);

function colocarEtiquetas(){
  // se colocan todas, se vean o no, para que no se muevan de sitio al ir poniendo piezas
  const vis={}; G.p.forEach(p=>{vis[p.id]=labs[p.id].style.display; labs[p.id].style.display='';});
  const cajas=[]; const pts=G.p.map(p=>({x:p.cp[0]-3.5,y:p.cp[1]-3.5,w:7,h:7,id:p.id}));
  const choca=(a,b)=>a.x<b.x+b.w&&b.x<a.x+a.w&&a.y<b.y+b.h&&b.y<a.y+a.h;
  const solape=(a,b)=>Math.max(0,Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x))*Math.max(0,Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y));
  const orden=G.p.slice().sort((a,b)=>{const n=q=>G.p.filter(o=>Math.hypot(o.cp[0]-q.cp[0],o.cp[1]-q.cp[1])<70).length;return n(b)-n(a)});
  orden.forEach(p=>{
    const t=labs[p.id]; t.setAttribute('x',0); t.setAttribute('y',0); t.setAttribute('text-anchor','start');
    const bb=t.getBBox(); const w=bb.width, h=bb.height, asc=-bb.y;
    const [cx,cy]=p.cp;
    const cand=[[6,-h/2],[-6-w,-h/2],[-w/2,-6-h],[-w/2,6],[5,-h-2],[5,2],[-5-w,-h-2],[-5-w,2],[10,-h/2],[-10-w,-h/2]];
    let mejor=null, coste=1e18;
    for(const [dx,dy] of cand){
      const c={x:cx+dx,y:cy+dy,w,h};
      let k=0;
      if(c.x<2||c.x+w>958||c.y<140||c.y+h>828) k+=1e6;
      for(const o of cajas) k+=solape(c,o)*10;
      for(const d of pts) if(d.id!==p.id) k+=solape(c,d)*4;
      if(k<coste){coste=k;mejor=c} if(k===0) break;
    }
    t.setAttribute('x',mejor.x); t.setAttribute('y',mejor.y+asc);
    cajas.push(mejor);
  });
  G.p.forEach(p=>labs[p.id].style.display=vis[p.id]);
}
colocarEtiquetas();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(colocarEtiquetas);

let nivel=0, fuera=new Set(), caja=[], mesa=[], fallos={}, hechos=leer();
function leer(){try{return JSON.parse(localStorage.getItem('puzle-prov-hechos'))||[]}catch(e){return[]}}
function guardar(){try{localStorage.setItem('puzle-prov-hechos',JSON.stringify(hechos))}catch(e){}}

function pintaNiveles(){
  $('niveles').innerHTML='';
  NIVELES.forEach((n,i)=>{
    const b=document.createElement('button'); b.className='niv'+(i===nivel?' on':'')+(hechos.includes(i)?' hecho':'');
    b.textContent=i+1; b.setAttribute('aria-label',n.t+': '+n.s); b.onclick=()=>empezar(i); $('niveles').appendChild(b);
  });
}

function empezar(i){
  nivel=i; const N=NIVELES[i]; const ids=N.ids();
  fuera=new Set(ids); fallos={}; caja=mezcla(ids); mesa=[];
  G.p.forEach(p=>{const q=fuera.has(p.id); paths[p.id].setAttribute('class','prov '+(q?'hueco':'puesta')); dots[p.id].style.display=q?'none':''; labs[p.id].style.display=q?'none':''; labs[p.id].classList.remove('nueva');});
  centrarEnHuecos();
  $('nivTit').textContent=N.t; $('nivSub').textContent='· '+N.s;
  $('fin').hidden=true; $('mesa').hidden=false;
  leyenda(N.solo?'Ahora la pieza solo dice la <b>capital</b>. Tienes que saber de qué provincia es.':'Arrastra cada pieza a su hueco. Si no es su sitio, vuelve a la mesa.');
  rellenar(); pintaNiveles();
}

function rellenar(){
  while(mesa.length<EN_MESA && caja.length) mesa.push(caja.shift());
  pintaMesa(); contador();
}
function contador(){
  $('contador').textContent='QUEDAN '+fuera.size+(fuera.size===1?' PIEZA':' PIEZAS');
  $('caja').textContent=caja.length?('En la caja: '+caja.length):'La caja está vacía';
  $('cambiar').hidden=!caja.length;
}
function pintaMesa(){
  const box=$('piezas'); box.innerHTML='';
  const solo=NIVELES[nivel].solo;
  mesa.forEach(id=>{
    const p=P[id], b=p.bb, w=b[1][0]-b[0][0], h=b[1][1]-b[0][1];
    const el=document.createElement('div'); el.className='pieza'; el.dataset.id=id; el.tabIndex=0; el.style.setProperty('--pc',nivel===4?'#FFFFFF':COL[id]);
    el.innerHTML='<svg viewBox="'+b[0][0]+' '+b[0][1]+' '+w+' '+h+'" preserveAspectRatio="xMidYMid meet"><path d="'+p.d+'"/></svg>'+
      '<div class="et">'+(solo?p.cap:(p.cap+'<small>'+p.prov+'</small>'))+'</div>';
    el.addEventListener('pointerdown',ev=>coger(ev,id,el));
    box.appendChild(el);
  });
}
function leyenda(html,tipo){const l=$('leyenda'); l.className='leyenda'+(tipo?' '+tipo:''); l.innerHTML=html}

// ---- arrastre ----
let drag=null;
function escala(){return svg.getBoundingClientRect().width/960}
function aSvg(x,y){const pt=svg.createSVGPoint(); pt.x=x; pt.y=y; return pt.matrixTransform(svg.getScreenCTM().inverse())}
function coger(ev,id,el){
  ev.preventDefault();
  const p=P[id], s=escala(), b=p.bb, w=b[1][0]-b[0][0], h=b[1][1]-b[0][1];
  const f=document.createElement('div'); f.className='fantasma'; f.style.setProperty('--pc',nivel===4?'#FFFFFF':COL[id]);
  f.innerHTML='<svg width="'+(w*s)+'" height="'+(h*s)+'" viewBox="'+b[0][0]+' '+b[0][1]+' '+w+' '+h+'"><path d="'+p.d+'"/></svg><span class="mira"></span>';
  const ox=(p.cen[0]-b[0][0])*s, oy=(p.cen[1]-b[0][1])*s;
  f.querySelector('.mira').style.left=(ox-6)+'px'; f.querySelector('.mira').style.top=(oy-6)+'px';
  document.body.appendChild(f);
  el.classList.add('cogida');
  drag={id,el,f,ox,oy,sobre:null};
  if((fallos[id]||0)>=2){ paths[id].classList.remove('pista'); void paths[id].getBBox(); paths[id].classList.add('pista'); }
  mover(ev);
  window.addEventListener('pointermove',mover,{passive:false});
  window.addEventListener('pointerup',soltar); window.addEventListener('pointercancel',soltar);
}
function mover(ev){
  if(!drag) return; ev.preventDefault&&ev.preventDefault();
  const x=ev.clientX, y=ev.clientY-LIFT;
  drag.f.style.transform='translate('+(x-drag.ox)+'px,'+(y-drag.oy)+'px)';
  const e=document.elementFromPoint(x,y);
  const nuevo=(e&&e.classList&&e.classList.contains('hueco'))?e:null;
  if(drag.sobre!==nuevo){ if(drag.sobre) drag.sobre.classList.remove('sobre'); if(nuevo) nuevo.classList.add('sobre'); drag.sobre=nuevo; }
  drag.x=x; drag.y=y; drag.cx=ev.clientX; drag.cy=ev.clientY;
  if(!drag.raf) drag.raf=requestAnimationFrame(bordes);
}
function bordes(){
  if(!drag) return; drag.raf=null;
  const v=$('visor'); if(!v.classList.contains('zoom')) return;
  const r=v.getBoundingClientRect(), x=drag.x, y=drag.y, m=36, sp=9; let mv=false;
  if(x>r.left&&x<r.right&&y>r.top-60&&y<r.bottom+20){
    if(x<r.left+m){v.scrollLeft-=sp;mv=true} else if(x>r.right-m){v.scrollLeft+=sp;mv=true}
    if(y<r.top+m){v.scrollTop-=sp;mv=true} else if(y>r.bottom-m&&y<r.bottom){v.scrollTop+=sp;mv=true}
  }
  if(mv) drag.raf=requestAnimationFrame(bordes);
}
function soltar(){
  window.removeEventListener('pointermove',mover); window.removeEventListener('pointerup',soltar); window.removeEventListener('pointercancel',soltar);
  if(!drag) return;
  const {id,el,f,x,y}=drag; if(drag.sobre) drag.sobre.classList.remove('sobre');
  f.remove(); el.classList.remove('cogida'); drag=null;
  const r=$('visor').getBoundingClientRect();
  if(x==null || x<r.left||x>r.right||y<r.top||y>r.bottom){ return; } // soltada fuera del mapa: vuelve sin más
  const pt=aSvg(x,y); const p=P[id];
  let dentro=false; try{ dentro=paths[id].isPointInFill(pt) }catch(e){}
  let cerca=null, dmin=1e9;
  G.p.forEach(q=>{const d=Math.hypot(q.cen[0]-pt.x,q.cen[1]-pt.y); if(d<dmin){dmin=d;cerca=q.id}});
  const tol=Math.max(26/escala(),0.5*Math.sqrt(p.area));
  if(dentro || (cerca===id && dmin<tol)) return encaja(id);
  // no encaja
  fallos[id]=(fallos[id]||0)+1;
  el.classList.remove('sacude'); void el.offsetWidth; el.classList.add('sacude');
  let donde=null; G.p.forEach(q=>{ try{ if(paths[q.id].isPointInFill(pt)) donde=q.id }catch(e){} });
  const nom=p.cap;
  if(donde && !fuera.has(donde)) leyenda('Ahí está <b>'+P[donde].cap+'</b> <span class="suave">('+P[donde].prov+')</span>. '+nom+' va en otro sitio.','mal');
  else if(donde) leyenda('Ese hueco no es de '+nom+'. Prueba en otro.','mal');
  else leyenda(nom+' no va ahí.','mal');
  if(fallos[id]===2) setTimeout(()=>leyenda('Pista: cuando vuelvas a coger <b>'+nom+'</b>, su hueco parpadeará.','mal'),1400);
}
function encaja(id){
  const p=P[id]; fuera.delete(id); mesa=mesa.filter(i=>i!==id);
  const e=paths[id]; e.setAttribute('class','prov puesta recien'); dots[id].style.display=''; labs[id].style.display=''; labs[id].classList.add('nueva');
  setTimeout(()=>e.classList.remove('recien'),900);
  leyenda('<b>'+p.cap+'</b> <span class="suave">· '+p.prov+'</span>','bien');
  chispas(p.cen,COL[id]);
  rellenar();
  if(!fuera.size) terminar();
}
function chispas(c,col){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  for(let k=0;k<12;k++){
    const a=k/12*Math.PI*2, d=26+Math.random()*22;
    const ci=document.createElementNS(NS,'circle'); ci.setAttribute('cx',c[0]); ci.setAttribute('cy',c[1]); ci.setAttribute('r',4.5);
    ci.setAttribute('class','chispa'); ci.setAttribute('fill',k%2?col:'#2E3440');
    ci.style.setProperty('--dx',(Math.cos(a)*d)+'px'); ci.style.setProperty('--dy',(Math.sin(a)*d)+'px');
    svg.appendChild(ci); setTimeout(()=>ci.remove(),800);
  }
}
function confeti(caja){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cols=Object.values(PAL).concat(['#2F86C6','#2E3440']);
  for(let k=0;k<34;k++){const c=document.createElement('span'); c.className='confeti';
    c.style.left=(Math.random()*100)+'%'; c.style.background=cols[k%cols.length]; c.style.animationDelay=(Math.random()*.5)+'s';
    caja.appendChild(c); setTimeout(()=>c.remove(),2300);}
}
function terminar(){
  if(!hechos.includes(nivel)){hechos.push(nivel); guardar()}
  pintaNiveles();
  $('mesa').hidden=true; const f=$('fin'); f.hidden=false;
  const lista=Object.keys(fallos).sort((a,b)=>fallos[b]-fallos[a]);
  let h='<h2>'+NIVELES[nivel].t+' terminado</h2>';
  h+= lista.length ? '<p>Estas costaron. Son las que hay que mirar otra vez:</p><ul>'+lista.map(i=>'<li><b>'+P[i].cap+'</b> <span class="suave">· '+P[i].prov+'</span><span>'+fallos[i]+(fallos[i]===1?' intento fallido':' intentos fallidos')+'</span></li>').join('')+'</ul>'
                   : '<p>Todas a la primera.</p>';
  h+='<div class="fila">'+(nivel<NIVELES.length-1?'<button class="btn main" id="sig">Nivel '+(nivel+2)+'</button>':'')+'<button class="btn" id="rep">Repetir este</button></div>';
  f.innerHTML=h; confeti(f);
  if($('sig')) $('sig').onclick=()=>empezar(nivel+1);
  $('rep').onclick=()=>empezar(nivel);
  leyenda(lista.length?'Nivel terminado. Mira la lista.':'Nivel terminado sin un fallo.','bien');
}

svg.addEventListener('click',ev=>{

$('cambiar').onclick=()=>{ caja=caja.concat(mesa); mesa=[]; rellenar(); };
function centrarEnHuecos(){
  const v=$('visor'); if(!v.classList.contains('zoom')) return;
  const ids=[...fuera]; if(!ids.length) return;
  const cx=ids.reduce((a,i)=>a+P[i].cen[0],0)/ids.length, cy=ids.reduce((a,i)=>a+P[i].cen[1],0)/ids.length;
  const s=escala(); v.scrollLeft=cx*s-v.clientWidth/2; v.scrollTop=(cy-138)*s-v.clientHeight/2;

function ponerLupa(on){
  $('visor').classList.toggle('zoom',on); $('lupa').textContent=on?'Ver el mapa entero':'Ampliar el mapa';

$('lupa').onclick=()=>ponerLupa(!$('visor').classList.contains('zoom'));
if(window.innerWidth<700) $('visor').classList.add('zoom'), $('lupa').textContent='Ver el mapa entero';
